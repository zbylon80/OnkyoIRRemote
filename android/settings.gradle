pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.android.application') {
                useModule("com.android.tools.build:gradle:${requested.version}")
            }
        }
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'OnkyoWidget'
include ':app'
if (providers.gradleProperty('touchProbe').isPresent()) {
    include ':touch-probe'
    project(':touch-probe').projectDir = file('probes/remote-touch')
}
